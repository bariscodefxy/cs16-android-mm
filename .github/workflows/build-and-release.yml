name: build & release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional manual release version (e.g. v0.0.2). Empty = follow commit message.'
        required: false
        default: ''

permissions:
  contents: write

env:
  ANDROID_DIR: android

# Trigger model: every branch push builds and refreshes the rolling
# `continuous` prerelease. A versioned vX.Y.Z release is cut ONLY when the
# HEAD commit message contains "release" (with the version in the message,
# e.g. "[release] v0.0.2") or when workflow_dispatch gets inputs.version.
# [android build]/[bundle build] flags still control the APK leg only.

# NOTE: intentionally a SINGLE job. The old 3-job layout passed ~200 MB
# through Actions artifacts on every tag and hit the repo artifact quota.
# All stages run sequentially anyway (needs:), so nothing is lost.
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Detect build type
        id: build_type
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          LOWER=$(echo "$MSG" | tr '[:upper:]' '[:lower:]')
          NEEDS_APK=false
          NEEDS_BUNDLE=false
          if echo "$LOWER" | grep -q '\[android build\]' || echo "$LOWER" | grep -q '\[version build\]'; then
            NEEDS_APK=true
          fi
          NEEDS_BUNDLE=true
          # Release is message-gated: a commit containing "release" (or a
          # manual dispatch with inputs.version) cuts a versioned release.
          # Everything else only refreshes the rolling `continuous` tag.
          NEEDS_RELEASE=false
          VERSION=""
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            case "$INPUT_VER" in v*) ;; *) INPUT_VER="v$INPUT_VER";; esac
            if ! echo "$INPUT_VER" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::inputs.version must look like v0.0.2 (got: $INPUT_VER)"
              exit 1
            fi
            NEEDS_RELEASE=true
            VERSION="$INPUT_VER"
          elif echo "$LOWER" | grep -q 'release'; then
            NEEDS_RELEASE=true
            VERSION=$(echo "$MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -z "$VERSION" ]; then
              echo "::error::Commit asks for a release but carries no vX.Y.Z version (e.g. '[release] v0.0.2')"
              exit 1
            fi
          fi
          if [ "$NEEDS_RELEASE" != "true" ]; then
            VERSION="v0.0.0-continuous.$(git rev-parse --short HEAD)"
          fi
          # Escape multiline for GitHub Actions output
          ESCAPED=$(echo "$MSG" | head -1 | sed 's/"/\\"/g')
          echo "commit_msg=$ESCAPED" >> "$GITHUB_OUTPUT"
          echo "needs_apk=$NEEDS_APK" >> "$GITHUB_OUTPUT"
          echo "needs_bundle=$NEEDS_BUNDLE" >> "$GITHUB_OUTPUT"
          echo "needs_release=$NEEDS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK build: $NEEDS_APK | Bundle build: $NEEDS_BUNDLE | Release: $NEEDS_RELEASE ($VERSION)"

      - name: Verify addons tree (ships on master)
        shell: bash
        run: |
          # addons/ lives directly on master (there is no amxx-addons
          # branch). Fail early with a clear message if it is missing.
          test -d addons/amxmodx/scripting || { echo "::error::addons/amxmodx/scripting missing"; exit 1; }
          test -f addons/metamod/plugins.ini || { echo "::error::addons/metamod/plugins.ini missing"; exit 1; }

      - name: Set up JDK
        if: steps.build_type.outputs.needs_apk == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK/NDK tooling
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install NDK r25c
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" \
            || (SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1); \
                [ -n "$SDKM" ] && echo "y" | "$SDKM" "ndk;25.2.9519653")
          NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/25.2.9519653 2>/dev/null)
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          command -v cmake >/dev/null || sudo apt-get update
          command -v cmake >/dev/null || sudo apt-get install -y cmake
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Cross-compile core + modules + plugins
        shell: bash
        run: |
          # amxmodx is fetched from upstream by build-amxx.sh and customized
          # by ./patches/; hlsdk + metamod-p come from git submodules
          # (android/hlsdk, android/mm-p), so no overlay copy step is needed.
          # arm64-v8a is mandatory; armeabi-v7a is best-effort (trial) and its
          # failure only drops the v7a bundle, it never fails the workflow.
          # No plugins-src dir: precompiled .sma sources were dropped, the
          # 4th arg stays empty so $ABI still lands on $5.
          for ABI in arm64-v8a armeabi-v7a; do
            if RELEASE_VERSION="${{ steps.build_type.outputs.version }}" bash ./android/ci/build-amxx.sh "$GITHUB_WORKSPACE/src" "$ANDROID_NDK_HOME" \
                "$GITHUB_WORKSPACE/build-out" "" "$ABI"; then
              echo "::group::OK $ABI"
              ls -l "$GITHUB_WORKSPACE/build-out/lib/$ABI" 2>/dev/null
              echo "::endgroup::"
            else
              echo "::endgroup::"
              if [ "$ABI" = "arm64-v8a" ]; then
                echo "::error::arm64-v8a cross-compile failed (required)"
                exit 1
              fi
              echo "::warning::armeabi-v7a cross-compile failed — v7a bundle will be skipped"
              touch "$GITHUB_WORKSPACE/v7a-missing"
            fi
          done

      - name: Build ReGameDLL libcs (first-spawn fix)
        shell: bash
        run: |
          set -euo pipefail
          # libcs is bundled from the berkchy/ReGameDLL_CS fork branch carrying the
          # first-spawn fix; built standalone with the NDK already installed above.
          RGDLL="$GITHUB_WORKSPACE/rgdll-src"
          rm -rf "$RGDLL" "$GITHUB_WORKSPACE/rgdll-build"
          git clone --depth 1 --branch fix/first-spawn-equip \
            https://github.com/berkchy/ReGameDLL_CS.git "$RGDLL"
          cmake -S "$RGDLL" -B "$GITHUB_WORKSPACE/rgdll-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DXASH_COMPAT=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$GITHUB_WORKSPACE/rgdll-build" --target regamedll --parallel 2
          SO="$GITHUB_WORKSPACE/rgdll-build/regamedll/libcs_android_arm64.so"
          test -f "$SO" || { echo "::error::libcs_android_arm64.so was not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a"
          cp "$SO" "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a/libcs_android_arm64.so"
          ls -l "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a/libcs_android_arm64.so"

      - name: Package release bundles
        shell: bash
        run: |
          # Incremental update: individual .so files + manifest.json
          RELEASE_VERSION="${{ steps.build_type.outputs.version }}" python3 ./android/ci/gen-manifest.py \
            arm64-v8a \
            "$GITHUB_WORKSPACE/build-out/lib/arm64-v8a" \
            "$GITHUB_WORKSPACE/incremental" \
            --plugins-dir "$GITHUB_WORKSPACE/build-out/plugins"
          # Rename manifest for arm64 (default ABI keeps manifest.json name)
          mv "$GITHUB_WORKSPACE/incremental/manifest.json" "$GITHUB_WORKSPACE/manifest.json"

          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a/libamxmodx.so" ]; then
            RELEASE_VERSION="${{ steps.build_type.outputs.version }}" python3 ./android/ci/gen-manifest.py \
              armeabi-v7a \
              "$GITHUB_WORKSPACE/build-out/lib/armeabi-v7a" \
              "$GITHUB_WORKSPACE/incremental-v7a"
            # Rename manifest for v7a to avoid conflict
            mv "$GITHUB_WORKSPACE/incremental-v7a/manifest.json" "$GITHUB_WORKSPACE/manifest-v7a.json"
          fi

          # Addons zip
          cd "$GITHUB_WORKSPACE"
          zip -r amxx-addons.zip addons/ -x '*.git*'

      - name: Install Android SDK platform & build tools
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          # The runner's preinstalled sdkmanager is too old for current SDK XML
          # (v4), which silently breaks --install. Use a fresh cmdline-tools zip.
          CMDT=commandlinetools-linux-11076708_latest.zip
          mkdir -p "$RUNNER_TEMP/sdkman"
          curl -fsSL -o "$RUNNER_TEMP/$CMDT" "https://dl.google.com/android/repository/$CMDT"
          rm -rf "$RUNNER_TEMP/sdkman/cmdline-tools"
          unzip -qo "$RUNNER_TEMP/$CMDT" -d "$RUNNER_TEMP/sdkman"
          SDKM="$RUNNER_TEMP/sdkman/cmdline-tools/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        if: steps.build_type.outputs.needs_apk == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Bundle debug signing keystore into app assets
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/keystore
          cp android/debug/patcher-release.p12 android/app/src/main/assets/keystore/debug.p12
          cp android/debug/debug_key.pem android/app/src/main/assets/keystore/debug_key.pem
          cp android/debug/debug_cert.pem android/app/src/main/assets/keystore/debug_cert.pem

      - name: Embed amxxpc compiler as native libs
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          # amxxpc compiler (produced by build-amxx.sh)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc" android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          cp "$GITHUB_WORKSPACE/build-out/compiler/arm64-v8a/amxxpc32.so" android/app/src/main/jniLibs/arm64-v8a/libamxxpc32.so
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libamxxpc.so
          # armeabi-v7a compiler (best-effort)
          if [ ! -f "$GITHUB_WORKSPACE/v7a-missing" ] && \
              [ -f "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" ]; then
            mkdir -p android/app/src/main/jniLibs/armeabi-v7a
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
            cp "$GITHUB_WORKSPACE/build-out/compiler/armeabi-v7a/amxxpc32.so" android/app/src/main/jniLibs/armeabi-v7a/libamxxpc32.so
            chmod +x android/app/src/main/jniLibs/armeabi-v7a/libamxxpc.so
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/

      - name: Build the patcher APK
        if: steps.build_type.outputs.needs_apk == 'true'
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.build_type.outputs.version }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Rename APK to nexora_vX.X.X.apk
        if: steps.build_type.outputs.needs_apk == 'true'
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          APK=$(ls *.apk 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            VERSION="${{ steps.build_type.outputs.version }}"
            VERSION="${VERSION#v}"
            mv "$APK" "nexora_v${VERSION}.apk"
            echo "Renamed: nexora_v${VERSION}.apk"
          fi

      - name: Create version tag
        if: github.ref_type == 'branch' && steps.build_type.outputs.needs_release == 'true'
        shell: bash
        run: |
          VER="${{ steps.build_type.outputs.version }}"
          if git rev-parse "$VER" >/dev/null 2>&1; then
            if [ "$(git rev-parse "$VER")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $VER already points at HEAD, reusing"
            else
              echo "::error::Tag $VER already exists on another commit — bump the version"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VER"
            git push origin "$VER"
            echo "Created tag $VER (token push does not retrigger CI)"
          fi

      - name: Release (versioned)
        if: github.ref_type == 'branch' && steps.build_type.outputs.needs_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build_type.outputs.version }}
          body: ${{ steps.build_type.outputs.commit_msg }}
          files: |
            amxx-addons.zip
            incremental/arm64-v8a/*.so
            incremental-v7a/armeabi-v7a/*.so
            ${{ steps.build_type.outputs.needs_apk == 'true' && 'android/app/build/outputs/apk/release/*.apk' || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Reset continuous release
        if: github.ref_type == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling tag: every branch push refreshes it. Delete first so
          # re-uploaded asset names never collide.
          gh release delete continuous -y --cleanup-tag || true

      - name: Publish continuous build
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous build
          body: ${{ steps.build_type.outputs.commit_msg }}
          prerelease: true
          files: |
            amxx-addons.zip
            incremental/arm64-v8a/*.so
            incremental-v7a/armeabi-v7a/*.so
            ${{ steps.build_type.outputs.needs_apk == 'true' && 'android/app/build/outputs/apk/release/*.apk' || '' }}
          generate_release_notes: false
          fail_on_unmatched_files: false

      - name: Notify Discord on successful release
        if: success() && github.ref_type == 'branch' && steps.build_type.outputs.needs_release == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set, skipping Discord notification"
            exit 0
          fi
          VERSION_FULL="${{ steps.build_type.outputs.version }}"
          VERSION="${VERSION_FULL#v}"
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_MSG=$(echo '${{ steps.build_type.outputs.commit_msg }}' | head -c 500)
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${VERSION_FULL}"
          if compgen -G "android/app/build/outputs/apk/release/*.apk" >/dev/null; then
            APK_COUNT=$(ls android/app/build/outputs/apk/release/*.apk | wc -l)
          else
            APK_COUNT=0
          fi
          if [ "$APK_COUNT" -gt 0 ]; then
            TITLE="Nexora v${VERSION} released"
            STATUS_FIELD=":white_check_mark: App update ready"
            TYPE_FIELD="App + libs"
            APK_URL="https://github.com/${REPO}/releases/download/${VERSION_FULL}/nexora_v${VERSION}.apk"
            APK_FIELD=", { \"name\": \"Download\", \"value\": \"[nexora_v${VERSION}.apk](${APK_URL})\", \"inline\": true }"
          else
            TITLE="Nexora v${VERSION} libs & plugins update"
            STATUS_FIELD=":white_check_mark: Libs & plugins updated"
            TYPE_FIELD="Bundle only (no APK)"
            APK_FIELD=""
          fi
          BODY=$(cat <<EOF
          {
            "embeds": [{
              "title": "${TITLE}",
              "description": "$COMMIT_MSG",
              "color": 5763719,
              "url": "${RELEASE_URL}",
              "thumbnail": { "url": "attachment://thumbnail.jpg" },
              "image": { "url": "attachment://image.jpg" },
              "fields": [
                { "name": "Status", "value": "${STATUS_FIELD}", "inline": true },
                { "name": "Version", "value": "v${VERSION}", "inline": true },
                { "name": "Type", "value": "${TYPE_FIELD}", "inline": true }${APK_FIELD}
              ]
            }]
          }
          EOF
          )
          curl -fsSL -F "payload_json=$BODY" \
            -F "thumbnail=@.github/assets/thumbnail.jpg" \
            -F "image=@.github/assets/image.jpg" \
            "$DISCORD_WEBHOOK" 2>&1 >/dev/null || { echo "Failed to send Discord webhook (exit=$?)"; exit 0; }
